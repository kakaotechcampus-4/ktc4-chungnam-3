spring:
  application:
    name: Remembrall
  ai:
    google:
      genai:
        # AI Studio(API 키) 모드가 기본. Vertex AI로 전환하려면 secrets.properties에
        # gemini.vertex-ai.enabled=true 와 project-id/location을 채우면 된다.
        api-key: ${gemini.api.key:}
        vertex-ai: ${gemini.vertex-ai.enabled:false}
        project-id: ${gemini.vertex-ai.project-id:}
        location: ${gemini.vertex-ai.location:us-central1}
  config:
    import: optional:file:./secrets.properties

# TODO: 협의 필요 - 실제 운영에서는 환경변수/시크릿 매니저로 관리할 것. 지금은 로컬 테스트용.
# 실제 키 값은 secrets.properties(git-ignored)에 적는다. 이 파일에는 절대 실제 키를 적지 말 것.
youtube:
  api:
    key: ${youtube.api.key:}

kakao:
  app-id: ${kakao.app-id:}

auth:
  session:
    ttl: ${session.ttl:30d}

recall:
  max-event-age: 30m
  member-cooldown: 10m
  agent-version: stub-v1

notification:
  max-title-length: 120
  max-body-length: 200
  fcm-credentials-path: ${FCM_CREDENTIALS_PATH:}
locationiq:
  api:
    key: ${locationiq.api.key:}
  # 실측 기반 기본값(2026-10-01, PR #20 리뷰 - 호출별 타임아웃 산정용): 15개 쿼리 평균 589ms, 최댓값 1252ms
  connect-timeout-ms: 2000
  read-timeout-ms: 3000

# 소상공인시장진흥공단 상가(상권)정보 - 개선②(공공 상가정보 연동)
dataportal:
  api:
    key: ${dataportal.api.key:}
  # 실측 기반 기본값(2026-10-01): 업종 코드 1개짜리 단일 호출 기준 6개 좌표 평균 578ms, 최댓값 1286ms
  connect-timeout-ms: 2000
  read-timeout-ms: 3000

franchise:
  # 프랜차이즈 기준점 반경(PlaceResolver.resolveViaAnchor) - 300 → 1000으로 조정(2026-10-02).
  # "교보문고 광화문점"이 기준점에서 500m+ 떨어져 있어 300m로는 못 찾았던 실측 사례 기반.
  anchor-radius-meters: 1000
